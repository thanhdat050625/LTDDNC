# Gradle JVM Memory Tuning (UTF-8 cho Windows, tối ưu GC & giới hạn RAM tránh lag máy)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -XX:SoftRefLRUPolicyMSPerMB=0 -Dfile.encoding=UTF-8

# Gradle Performance & Caching
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin Compilation & Daemon Tuning
kotlin.incremental=false
kapt.incremental.apt=false
kotlin.daemon.jvm.options=-Xmx1024m

# Android & Flutter Compatibility
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Flutter template flags (giữ nguyên cho AGP / Kotlin mới)
android.newDsl=false
android.builtInKotlin=false
