# Gradle JVM Memory Tuning (Tối ưu RAM: 2.5GB Heap + 512MB Metaspace, không ăn 8G-12G gây treo/lag máy)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:SoftRefLRUPolicyMSPerMB=0

# Gradle Performance & Caching
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin Incremental Compilation
kotlin.incremental=true
kapt.incremental.apt=true

# Android & Flutter Compatibility
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
